---
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formula-audit:
    name: Formula audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Audit all formulae
        run: |
          for f in Formula/*.rb; do
            brew audit --strict "idvoretskyi/tap/$(basename "$f" .rb)"
          done

  e2e-macos:
    name: E2E test (macOS)
    runs-on: macos-latest
    needs: formula-audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install formulae from tap
        run: |
          for f in Formula/*.rb; do
            brew install "idvoretskyi/tap/$(basename "$f" .rb)"
          done

      - name: Run brew test
        run: |
          for f in Formula/*.rb; do
            brew test "idvoretskyi/tap/$(basename "$f" .rb)"
          done

      - name: Cleanup
        if: always()
        run: |
          for f in Formula/*.rb; do
            brew uninstall "$(basename "$f" .rb)" || true
          done

  e2e-linux:
    name: E2E test (Linux)
    runs-on: ubuntu-latest
    needs: formula-audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install formulae from tap
        run: |
          for f in Formula/*.rb; do
            brew install "idvoretskyi/tap/$(basename "$f" .rb)"
          done

      - name: Run brew test
        run: |
          for f in Formula/*.rb; do
            brew test "idvoretskyi/tap/$(basename "$f" .rb)"
          done

      - name: Cleanup
        if: always()
        run: |
          for f in Formula/*.rb; do
            brew uninstall "$(basename "$f" .rb)" || true
          done
